name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm RimWorldRandomizer.spec

      - name: Prepare release asset
        shell: pwsh
        run: |
          $assetName = "RimWorldRandomizer-$env:GITHUB_REF_NAME-windows.exe"
          Copy-Item -Path "dist\RimWorldRandomizer.exe" -Destination "dist\$assetName" -Force
          "ASSET_NAME=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          RimWorld Randomizer $env:GITHUB_REF_NAME

          - Randomized RimWorld start parameters
          - Optional DLC selection for Royalty, Ideology, Biotech, and Anomaly
          - Battered spaceship start-computer interface
          - Windows EXE build
          "@

          $assetPath = "dist\$env:ASSET_NAME"
          $releaseTitle = "RimWorld Randomizer $env:GITHUB_REF_NAME"

          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $assetPath --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assetPath --title $releaseTitle --notes $notes
          }
